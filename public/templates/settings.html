{% extends "base.html" %}

{% block title %}Saloon - Settings{% endblock %}

{% block content %}
  <div class="mt-6 bg-[#FEFAF7] rounded-3xl p-6">
    <h1 class="text-2xl font-semibold text-gray-900">Settings</h1>
    <div class="mt-4">
      {% if user.is_authenticated %}
        <a href="{% url 'account_logout' %}" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-red-500 text-white text-sm font-semibold">
          Logout
        </a>
      {% else %}
        <a href="{% url 'account_login' %}" class="text-sm font-semibold text-[#B58C4E]">Login</a>
      {% endif %}
    </div>
  </div>
{% endblock %}
