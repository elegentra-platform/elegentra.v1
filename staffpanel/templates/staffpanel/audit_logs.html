{% extends "staffpanel/base.html" %}
{% block content %}
<h2 class="text-xl font-semibold">{{ page_title|default:"Audit Logs" }}</h2>
<div class="mt-4 overflow-hidden rounded-xl border border-[#d8e0ea] bg-white shadow-sm">
  {% for event in events %}<div class="grid gap-2 border-b border-slate-100 px-4 py-3 text-sm last:border-b-0 md:grid-cols-[170px_1fr_120px_120px]"><span>{{ event.created_at|date:"d M Y H:i" }}</span><span class="truncate">{{ event.event_name }}</span><span>{{ event.verification_status }}</span><span>{{ event.processing_status }}</span></div>{% empty %}<div class="px-4 py-10 text-center text-sm text-slate-500">No events yet.</div>{% endfor %}
</div>
{% endblock %}
