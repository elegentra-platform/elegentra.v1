{% extends "staffpanel/base.html" %}
{% block content %}
<h2 class="text-xl font-semibold">{{ page_title }}</h2>
<div class="mt-4 rounded-xl border border-[#d8e0ea] bg-white p-4 shadow-sm">
  {% for item in items %}<div class="border-b border-slate-100 py-3 text-sm last:border-b-0">{{ item.user.get_full_name|default:item.user.email }} - {{ item.get_role_display }}</div>{% empty %}<p class="text-sm text-slate-500">No records yet.</p>{% endfor %}
</div>
{% endblock %}
