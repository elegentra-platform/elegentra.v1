<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Elegentra Admin Login</title><link rel="stylesheet" href="/static/css/output.css"></head>
<body class="min-h-screen bg-[#f4f7fb] text-slate-900">
  <main class="flex min-h-screen items-center justify-center px-4">
    <section class="w-full max-w-md rounded-2xl border border-[#d8e0ea] bg-white p-6 shadow-sm">
      <h1 class="text-2xl font-semibold">Elegentra Admin</h1>
      <p class="mt-1 text-sm text-slate-500">Email and password access for admins.</p>
      {% if messages %}{% for message in messages %}<div class="mt-4 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{{ message }}</div>{% endfor %}{% endif %}
      <form method="post" class="mt-5 space-y-4">{% csrf_token %}
        <div><label class="text-sm font-medium text-slate-700">Email</label><input type="email" name="email" class="mt-2 w-full rounded-xl border border-[#d8e0ea] px-4 py-3 text-sm outline-none focus:border-slate-900" required></div>
        <div><label class="text-sm font-medium text-slate-700">Password</label><input type="password" name="password" class="mt-2 w-full rounded-xl border border-[#d8e0ea] px-4 py-3 text-sm outline-none focus:border-slate-900" required></div>
        <button class="w-full rounded-xl bg-slate-950 px-4 py-3 text-sm font-semibold text-white">Login</button>
        <a href="{% url 'staffpanel:staff_login' %}" class="block text-center text-sm text-slate-500">Staff code login</a>
      </form>
    </section>
  </main>
</body>
</html>
