{% extends "saloons/dashboard/dashboard.html" %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-6">

  <h1 class="text-xl font-semibold mb-4">
    {% if service %}Edit Service{% else %}Add Service{% endif %}
  </h1>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% if return_to %}
      <input type="hidden" name="return_to" value="{{ return_to }}">
    {% endif %}

    <!-- Service Name -->
    <div>
      <label class="block text-sm font-medium mb-1">Service name</label>
      <input
        type="text"
        name="name"
        value="{{ service.name|default:'' }}"
        class="w-full border rounded-lg px-3 py-2"
        required
      >
    </div>

    <!-- Price -->
    <div>
      <label class="block text-sm font-medium mb-1">Price</label>
      <input
        type="number"
        name="price"
        value="{{ service.price|default:'' }}"
        class="w-full border rounded-lg px-3 py-2"
        required
      >
    </div>

    <!-- Category Select -->
    <div>
      <label class="block text-sm font-medium mb-1">Category</label>
      <select
        name="category"
        class="w-full border rounded-lg px-3 py-2"
      >
        <option value="">Select category</option>
        {% for main in main_categories %}
          <option value="main:{{ main.id }}" class="font-semibold"
            {% if service and service.main_category_id == main.id %}selected{% endif %}>
            {{ main.name }}
          </option>
          {% for cat in main.approved_subcategories %}
            <option value="category:{{ cat.id }}"
              {% if service and service.category_id == cat.id %}selected{% endif %}>
              &nbsp;&nbsp;— {{ cat.name }}
            </option>
          {% endfor %}
        {% endfor %}
        {% if own_pending_categories %}
          <optgroup label="Your submitted categories (pending approval)">
            {% for cat in own_pending_categories %}
              <option value="category:{{ cat.id }}"
                {% if service and service.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
          </optgroup>
        {% endif %}
      </select>
      <p class="mt-1 text-xs text-gray-500">Choose a main category if no exact subcategory fits.</p>
    </div>

    <!-- OR New Category -->
    <div>
      <label class="block text-sm font-medium mb-1">Or add new category</label>
      <input
        type="text"
        name="new_category"
        placeholder="New category"
        class="w-full border rounded-lg px-3 py-2"
      >
    </div>

    <!-- Visibility -->
    <div class="flex items-center gap-2">
      <input
        type="checkbox"
        name="is_visible"
        id="is_visible"
        {% if not service or service.is_visible %}checked{% endif %}
      >
      <label for="is_visible" class="text-sm">
        Visible to customers
      </label>
    </div>

    <!-- Submit -->
    <button
      type="submit"
      class="bg-blue-500 text-white px-5 h-10 rounded-lg font-semibold"
    >
      Save
    </button>

  </form>

</div>
{% endblock %}
