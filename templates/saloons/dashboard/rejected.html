{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Salon review failed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="max-w-xl bg-white rounded-2xl p-10 shadow-sm text-center">

  <h1 class="text-2xl font-semibold text-red-600">
    Salon verification failed
  </h1>

  <p class="text-gray-600 mt-3">
    Your salon <strong>{{ saloon.name }}</strong> was reviewed but needs corrections.
  </p>

  <div class="mt-6 space-y-3 text-left">
    {% for reason in saloon.rejection_reasons.all %}
      <div class="bg-red-50 border border-red-200 rounded-xl p-4">
        <p class="text-sm text-red-700">
          {{ reason.message }}
        </p>
      </div>
    {% endfor %}
  </div>

  <div class="mt-8 flex flex-col gap-3">
    <a
      href="{% url 'saloon_onboarding_step_one' %}"
      class="bg-black text-white py-3 rounded-xl font-medium"
    >
      Fix & resubmit details
    </a>

    <a href="/" class="text-sm text-gray-500">
      ← Back to home
    </a>
  </div>

</div>

</body>
</html>
